[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobpred"
version = "2.0.0"
description = "Short-horizon BTC/USDT price prediction from Level 2 order book and trade data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Quddus Bello" }]
dependencies = [
    "websockets>=12",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "sortedcontainers>=2.4",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
dashboard = ["dash>=2.14", "dash-bootstrap-components>=1.5", "plotly>=5.18"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
