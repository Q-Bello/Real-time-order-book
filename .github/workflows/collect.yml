name: Collect live data and run research

# Runs when this branch is pushed: records live BTC/USDT data, rebuilds the dataset,
# evaluates the models, writes the report, and commits reports/ to the PR branch.
on:
  push:
    branches: [ci/collect]

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      # Binance's public market-data endpoints (the main domain is unavailable from CI runner locations).
      LOBPRED_WS_URL: "wss://data-stream.binance.vision/stream?streams={s}@depth@100ms/{s}@aggTrade"
      LOBPRED_SNAPSHOT_URL: "https://data-api.binance.vision/api/v3/depth?symbol={S}&limit=1000"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/research-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # Re-uses the 4-hour recording from the first run instead of recording again.
      - name: Download saved recording
        uses: actions/download-artifact@v4
        with:
          name: raw-recording
          path: data/raw/
          run-id: 38486075600
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dataset, evaluate, report
        run: |
          python -m lobpred.dataset data/raw/*.jsonl.gz
          python -m lobpred.evaluate
          python -m lobpred.report

      - name: Headline numbers
        run: |
          python - <<'PY'
          import json
          s = json.load(open("reports/dataset_summary.json"))
          r = json.load(open("reports/results.json"))
          print(f"::notice::DATA {json.dumps(s)}")
          for h, models in r["metrics"].items():
              row = {m: {k: v["mean"] for k, v in d.items()} for m, d in models.items()}
              print(f"::notice::METRICS {h} {json.dumps(row)}")
          for h, bt in r["backtest"].items():
              print(f"::notice::BACKTEST {h} {json.dumps(bt)}")
          for h, imp in r["importance"].items():
              print(f"::notice::IMPORTANCE {h} {json.dumps(dict(list(imp.items())[:6]))}")
          PY

      - name: Commit reports to the PR branch
        run: |
          git config user.name "Quddus Bello"
          git config user.email "quddusbello@gmail.com"
          git add reports
          git commit -m "Regenerate report with updated backtest chart" || echo "No changes"
          git push origin HEAD:feat/research-pipeline

